<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2A號巴士到站時間</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px 16px;
      -webkit-user-select: none;
      user-select: none;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      margin: 0 0 8px 0;
      color: #0f172a;
      font-weight: 800;
    }
    .update-time {
      font-size: 0.95rem;
      color: #475569;
      font-weight: bold;
    }

    /* 限制最大闊度為 500px 並置中 */
    .container, footer {
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 🗂️ 方向大按鈕 (左邊由美孚開出，右邊由樂華開出) */
    .tab-container {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 16px 10px;
      background: #ffffff;
      color: #334155;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #e11d48;
      color: #ffffff;
      border-color: #e11d48;
      box-shadow: 0 6px 16px rgba(225, 29, 72, 0.3);
    }

    /* 📍 GPS 定位大按鈕 */
    .gps-btn {
      width: 100%;
      padding: 16px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      margin-bottom: 16px;
    }
    .gps-btn:active { transform: scale(0.98); }

    /* 📍 車站選擇超大下拉選單 */
    .selector-container {
      margin-bottom: 20px;
    }
    .select-label {
      font-size: 1.05rem;
      font-weight: bold;
      color: #334155;
      margin-bottom: 8px;
      display: block;
    }
    .stop-select {
      width: 100%;
      padding: 16px;
      font-size: 1.15rem;
      font-weight: bold;
      color: #0f172a;
      background-color: #ffffff;
      border: 3px solid #e11d48;
      border-radius: 16px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e11d48' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 20px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.15);
      outline: none;
    }
    
    /* 🚌 超大清晰實時資訊卡片 */
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-left: 10px solid #e11d48;
      text-align: center;
    }
    
    .route-number {
      font-size: 2.2rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .destination {
      font-size: 1.2rem;
      color: #475569;
      font-weight: bold;
      margin-bottom: 16px;
    }
    
    .eta-first {
      font-size: 2.2rem;
      font-weight: 900;
      color: #059669;
      margin: 10px 0;
    }
    .eta-subsequent {
      font-size: 1.1rem;
      color: #475569;
      margin-top: 8px;
      font-weight: bold;
    }
    .eta-arriving {
      color: #e11d48;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .loading {
      text-align: center;
      color: #475569;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 30px 0;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* 🔗 返回主頁按鈕 */
    .link-container {
      margin-top: 30px;
      margin-bottom: 20px;
    }
    .back-btn {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #0f172a;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: block;
    }
    .back-btn:active { background: #f1f5f9; }

    footer {
      text-align: center;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .notice-text { font-size: 0.95rem; color: #475569; line-height: 1.5; margin: 0; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🚌 2A 號巴士到站時間</h1>
      <div id="update-time" class="update-time">正在更新時間...</div>
    </header>

    <!-- 🗂️ 方向選擇：左邊由樂華開出（預設 active），右邊由美孚開出 -->
    <div class="tab-container">
      <div id="btn-meifoo" class="tab-btn active" onclick="switchDirection('meifoo')">🏡 由 樂華開出</div>
      <div id="btn-lokwah" class="tab-btn" onclick="switchDirection('lokwah')">🏢 由 美孚開出</div>
    </div>

    <!-- 📍 GPS 定位按鈕 -->
    <div>
      <button class="gps-btn" onclick="findNearestStop()">
        📍 幫我找出附近的車站
      </button>
    </div>

    <!-- 下拉選單 -->
    <div class="selector-container" id="selector-container">
      <label class="select-label" for="stop-selector">👇 或直接在這裡點選您的車站：</label>
      <select id="stop-selector" class="stop-select" onchange="onStopChange()">
        <!-- 選項將由 JS 動態生成 -->
      </select>
    </div>

    <div id="bus-container" class="loading">正在載入車次資料...</div>

    <!-- 🔗 返回主頁按鈕 -->
    <div class="link-container">
      <a href="index.html" class="back-btn">
        ⬅️ 返回主畫面
      </a>
    </div>

    <footer>
      <p class="notice-text">💡 畫面每 30 秒會自動更新，不需要重新整理。</p>
    </footer>
  </div>

  <script>
    const ROUTE = "2A";
    
    let stopsData = { lokwah: [], meifoo: [] };
    let currentDirection = 'meifoo'; // 預設以美孚開出
    let currentSeq = 1;
    let isDataReady = false;
    let autoRefreshTimer = null;

    function formatTime(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
    }

    async function initData() {
      try {
        const kmbStopsRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop').then(r => r.json());
        const kmbStopsMap = {};
        const kmbCoordsMap = {};
        if (kmbStopsRes.data) {
          kmbStopsRes.data.forEach(s => { 
            kmbStopsMap[s.stop] = s.name_tc; 
            kmbCoordsMap[s.stop] = { lat: parseFloat(s.lat), long: parseFloat(s.long) };
          });
        }

        const kmbInRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${ROUTE}/inbound/1`).then(r => r.json());
        const kmbOutRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${ROUTE}/outbound/1`).then(r => r.json());
        
        stopsData.lokwah = (kmbInRes.data || []).map(k => ({
          seq: k.seq,
          stopId: k.stop,
          name: kmbStopsMap[k.stop] || `第 ${k.seq} 站`,
          coords: kmbCoordsMap[k.stop] || null
        }));

        stopsData.meifoo = (kmbOutRes.data || []).map(k => ({
          seq: k.seq,
          stopId: k.stop,
          name: kmbStopsMap[k.stop] || `第 ${k.seq} 站`,
          coords: kmbCoordsMap[k.stop] || null
        }));

        isDataReady = true;
        
        populateDropdown(true);
        fetchRoute2AETA();

        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
        autoRefreshTimer = setInterval(fetchRoute2AETA, 30000);

      } catch (e) {
        console.error('初始化失敗:', e);
        document.getElementById('bus-container').innerHTML = '<p class="loading" style="color:#e11d48;">網絡連線有點問題，請稍候再試</p>';
      }
    }

    async function fetchRoute2AETA() {
      if (!isDataReady) return;
      
      try {
        const container = document.getElementById('bus-container');
        const dirCode = currentDirection === 'lokwah' ? 'I' : 'O';

        const kmbRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${ROUTE}/1`).then(r => r.json());
        const list = kmbRes.data || [];
        
        const filteredKmb = list.filter(item => item.dir === dirCode && parseInt(item.seq) === currentSeq);
        const nowTime = new Date().getTime();

        let filteredList = filteredKmb.filter(item => {
          if (!item.eta) return false;
          const busTime = new Date(item.eta).getTime();
          const diffMinutes = (busTime - nowTime) / 60000;
          const isArrivingOnly = item.rmk_tc && (item.rmk_tc.includes('到達') || item.rmk_tc.includes('落客'));
          
          const isLastStop = currentSeq === stopsData[currentDirection].length;
          if (isLastStop && isArrivingOnly && diffMinutes >= -2) return true;
          
          return diffMinutes >= -2 && !isArrivingOnly;
        });

        filteredList.sort((a, b) => new Date(a.eta) - new Date(b.eta));

        const uniqueBusList = [];
        filteredList.forEach(item => {
          const time = new Date(item.eta).getTime();
          const isDuplicate = uniqueBusList.some(existing => {
            const existingTime = new Date(existing.eta).getTime();
            return Math.abs(existingTime - time) < 60000;
          });
          if (!isDuplicate) uniqueBusList.push(item);
        });

        if (uniqueBusList.length === 0) {
          container.innerHTML = '<p class="loading" style="color:#475569;">目前這個站暫時沒有班次資料</p>';
          updateTimestamp();
          return;
        }

        container.innerHTML = '';

        const firstBus = uniqueBusList[0];
        const now = new Date();
        const actionWord = currentSeq === 1 ? '開出' : '到達';

        const diff1 = Math.round((new Date(firstBus.eta) - now) / 60000);
        const clockTime1 = formatTime(firstBus.eta);
        let etaDisplay1 = diff1 <= 0 ? `即將${actionWord} (${clockTime1})` : `${diff1} 分鐘後 (${clockTime1})`;
        let isArriving1 = diff1 <= 0;

        let subsequentHTML = '';
        if (uniqueBusList.length > 1) {
          const nextBus = uniqueBusList[1];
          const diffNext = Math.round((new Date(nextBus.eta) - now) / 60000);
          const clockTimeNext = formatTime(nextBus.eta);
          const textNext = diffNext <= 0 ? `即將${actionWord} (${clockTimeNext})` : `${diffNext} 分鐘 (${clockTimeNext})`;
          subsequentHTML = `<div class="eta-subsequent">下一班：${textNext}</div>`;
        }

        let destDisplay = firstBus.dest_tc || (currentDirection === 'lokwah' ? '美孚' : '樂華');

        const card = document.createElement('div');
        card.className = `card`;
        card.innerHTML = `
          <div class="route-number">2A 號巴士</div>
          <div class="destination">往：${destDisplay}</div>
          <div class="eta-first ${isArriving1 ? 'eta-arriving' : ''}">${etaDisplay1}</div>
          ${subsequentHTML}
        `;
        container.appendChild(card);

        updateTimestamp();

      } catch (error) {
        console.error('獲取數據失敗:', error);
        document.getElementById('bus-container').innerHTML = '<p class="loading" style="color:#e11d48;">暫時無法讀取資料，請稍後再試</p>';
      }
    }

    function findNearestStop() {
      if (!navigator.geolocation) {
        alert("您的手機不支援定位功能");
        return;
      }

      document.getElementById('bus-container').innerHTML = '<p class="loading">正在尋找您附近的車站...</p>';

      navigator.geolocation.getCurrentPosition(position => {
        const userLat = position.coords.latitude;
        const userLon = position.coords.longitude;

        let nearestStop = null;
        let minDistance = Infinity;
        let matchedDirection = 'meifoo';

        ['meifoo', 'lokwah'].forEach(dir => {
          stopsData[dir].forEach(stop => {
            if (stop.coords) {
              const dist = getDistanceFromLatLonInKm(userLat, userLon, stop.coords.lat, stop.coords.long);
              if (dist < minDistance) {
                minDistance = dist;
                nearestStop = stop;
                matchedDirection = dir;
              }
            }
          });
        });

        if (nearestStop) {
          if (currentDirection !== matchedDirection) {
            currentDirection = matchedDirection;
            document.getElementById('btn-meifoo').classList.remove('active');
            document.getElementById('btn-lokwah').classList.remove('active');
            document.getElementById(`btn-${matchedDirection}`).classList.add('active');
            populateDropdown(false);
          }

          currentSeq = nearestStop.seq;
          document.getElementById('stop-selector').value = currentSeq;
          fetchRoute2AETA();
        } else {
          alert("找不到附近的車站");
        }

      }, error => {
        alert("無法取得您的位置，請檢查手機定位權限是否開啟。");
        fetchRoute2AETA();
      }, { timeout: 10000 });
    }

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI/180);
      const dLon = (lon2 - lon1) * (Math.PI/180);
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function switchDirection(dir) {
      if (!isDataReady || currentDirection === dir) return;
      currentDirection = dir;
      
      document.getElementById('btn-meifoo').classList.remove('active');
      document.getElementById('btn-lokwah').classList.remove('active');
      document.getElementById(`btn-${dir}`).classList.add('active');
      
      populateDropdown(true);
      document.getElementById('bus-container').innerHTML = '<p class="loading">正在切換...</p>';
      fetchRoute2AETA();
    }

    function populateDropdown(resetToFirst = true) {
      const select = document.getElementById('stop-selector');
      select.innerHTML = '';
      const list = stopsData[currentDirection];
      
      list.forEach(stop => {
        const opt = document.createElement('option');
        opt.value = stop.seq;
        opt.textContent = `${stop.seq}. ${stop.name}`;
        select.appendChild(opt);
      });
      
      if (resetToFirst) {
        currentSeq = 1;
        select.value = 1;
      } else {
        select.value = currentSeq;
      }
    }

    function onStopChange() {
      const select = document.getElementById('stop-selector');
      currentSeq = parseInt(select.value);
      document.getElementById('bus-container').innerHTML = '<p class="loading">正在查詢車次...</p>';
      fetchRoute2AETA();
    }

    function updateTimestamp() {
      const now = new Date();
      document.getElementById('update-time').innerText = `最後更新：${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }

    initData();
  </script>
</body>
</html>
